; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = RX_FSK
data_dir = RX_FSK/data

[extra]
lib_deps_builtin = 
lib_deps_external = 
	olikraus/U8g2
	stevemarple/MicroNMEA @ ^2.0.5
	https://github.com/ESP32Async/AsyncTCP
	https://github.com/ESP32Async/ESPAsyncWebServer
	https://github.com/moononournation/Arduino_GFX#v1.4.9
	https://github.com/HeMan/async-mqtt-client
lib_ignore = 
	AsyncTCP-esphome

[env:ttgo-lora32]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.08.10/platform-espressif32.zip
board = ttgo-lora32-v21
board_build.filesystem = littlefs
board_build.littlefs_version = 2.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	${extra.lib_deps_builtin}
	${extra.lib_deps_external}
	paulstoffregen/Time@^1.6.0
lib_ignore = 
	Time
	AsyncTCP-esphome
build_flags = -DCORE_DEBUG_LEVEL=0 -fno-lto
build_unflags = -flto
extra_scripts = 
	scripts/pio-build-extension.py
board_build.partitions = partitions-rdz.csv

[env:heltec-lora32-v3]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.08.10/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
board_build.filesystem = littlefs
board_build.littlefs_version = 2.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	${extra.lib_deps_builtin}
	${extra.lib_deps_external}
	paulstoffregen/Time@^1.6.0
lib_ignore = 
	Time
	AsyncTCP-esphome
build_flags = -DCORE_DEBUG_LEVEL=3 -fno-lto -DHELTEC_V3 -DSX126X -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags = -flto
extra_scripts = 
	scripts/pio-build-extension.py
board_build.partitions = partitions-rdz.csv
